<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUYONG's</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --surface: #0d0d0d;
    --ink: #f4f4f4;
    --muted: #9b9b9b;
    --line: #2a2a2a;
    --accent: #ff3b44;
    --accent-soft: #2b0e10;
    --thumb: #141414;
    /* 분류별 버블 색: 빨강, 흰색, 회색 계열만 사용 */
    --c0: #ff3b44; --c1: #f4f4f4; --c2: #b3262d; --c3: #bdbdbd; --c4: #ff7a80; --c5: #7d7d7d;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.6;
  }

  /* 읽은 위치를 보여주는 진행 막대 */
  .progress {
    position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 30;
    background: var(--accent);
    transform: scaleX(0); transform-origin: 0 50%;
  }

  /* 첫 화면: 버블 선택 */
  .hero {
    max-width: 1120px; margin: 0 auto; padding: 56px 24px 32px; text-align: center;
    min-height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .hero h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em; margin: 0 0 8px; }
  .hero p { margin: 0 0 40px; color: var(--muted); }
  .bubbles { position: relative; width: 100%; max-width: 960px; }
  .bubble {
    --base: clamp(104px, 22vw, 160px);
    position: absolute; left: 0; top: 0;
    width: calc(var(--base) * var(--k)); aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; padding: 14px;
    text-align: center; text-decoration: none; color: var(--ink);
    font-weight: 600; font-size: 0.95rem; line-height: 1.35; word-break: keep-all;
    background: color-mix(in srgb, var(--c) 16%, var(--surface));
    border: 2px solid var(--c);
    transition: scale .2s ease; will-change: transform;
  }
  .bubble span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .bubble:hover { scale: 1.06; }
  .bubble:focus-visible { outline: 3px solid var(--c); outline-offset: 4px; }
  .legend { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin: 32px 0 0; padding: 0; font-size: 0.88rem; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .down { margin-top: 28px; color: var(--accent); font-size: 0.95rem; }

  /* 전체 목록 머리말과 검색 */
  .top { max-width: 1120px; margin: 0 auto; padding: 56px 24px 24px; }
  .top { scroll-margin-top: 0; }
  .top h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 6px; }
  .top p { margin: 0 0 24px; color: var(--muted); }
  .search {
    width: 100%; max-width: 480px;
    padding: 12px 16px;
    font: inherit; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 본문 배치: 왼쪽 목차 + 오른쪽 카탈로그 */
  .layout {
    max-width: 1120px; margin: 0 auto; padding: 0 24px 96px;
    display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 40px;
  }
  .nav { position: sticky; top: 24px; align-self: start; }
  .nav ul { list-style: none; margin: 0; padding: 0; }
  .nav a {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 8px 12px; margin-bottom: 2px;
    color: var(--muted); text-decoration: none; font-size: 0.95rem;
    border-left: 3px solid var(--line);
  }
  .nav a:hover { color: var(--ink); }
  .nav a.active { color: var(--accent); font-weight: 700; border-left-color: var(--accent); background: var(--accent-soft); }
  .nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav .n { font-variant-numeric: tabular-nums; }

  /* 태그 필터 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip {
    font: inherit; font-size: 0.88rem; color: var(--muted);
    padding: 5px 14px; cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
  }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  .chip[aria-pressed="true"] { color: #000; background: var(--accent); border-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 분류 구역 */
  section { scroll-margin-top: 24px; padding-top: 24px; }
  section h2 {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 16px;
  }
  section h2 small { font-size: 0.9rem; font-weight: 400; color: var(--muted); }
  .grid { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 4px 14px; margin: -4px -4px 0; overscroll-behavior-x: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .grid > .card { flex: 0 0 260px; scroll-snap-align: start; }   /* 카드가 많아지면 옆으로 넘겨서 봄 */
  main { min-width: 0; }

  /* 카드 */
  .card {
    position: relative; display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--thumb); border-bottom: 1px solid var(--line); }
  .thumb iframe {
    position: absolute; top: 0; left: 0; width: 1280px; height: 800px; border: 0;
    transform: scale(var(--s, 0.2)); transform-origin: 0 0; pointer-events: none;
  }
  .thumb .ph {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 2.6rem; font-weight: 800; color: var(--accent); opacity: .55;
  }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .body h3 { margin: 0; font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; }
  .body h3 a { color: inherit; text-decoration: none; }
  .body h3 a::after { content: ""; position: absolute; inset: 0; }   /* 카드 전체를 링크로 */
  .body h3 a:focus-visible { outline: none; }
  .card:has(h3 a:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .body p { margin: 0; font-size: 0.9rem; color: var(--muted); }
  .meta { margin-top: auto; padding-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.8rem; color: var(--muted); }
  .tag { padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

  .empty { display: none; padding: 48px 0; color: var(--muted); }
  .empty.show { display: block; }

  /* 맨 위로 */
  .to-top {
    position: fixed; right: 24px; bottom: 24px; z-index: 20;
    padding: 10px 16px; font: inherit; font-size: 0.9rem; cursor: pointer;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .to-top.show { opacity: 1; pointer-events: auto; }
  .to-top:hover { border-color: var(--accent); }
  .to-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer { max-width: 1120px; margin: 0 auto; padding: 0 24px 48px; font-size: 0.85rem; color: var(--muted); }
  footer a { color: var(--accent); }

  /* 모바일: 목차가 상단 가로 막대로 바뀜 */
  @media (max-width: 760px) {
    .top { padding-top: 40px; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .nav {
      position: sticky; top: 0; z-index: 10; margin: 0 -24px; padding: 8px 24px;
      background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto;
    }
    .nav ul { display: flex; gap: 8px; }
    .nav a { white-space: nowrap; border-left: 0; border-radius: 999px; border: 1px solid var(--line); margin: 0; padding: 4px 14px; }
    .nav a.active { border-color: var(--accent); }
    section { scroll-margin-top: 64px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card, .to-top, .bubble { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<header class="hero">
  <h1>SUYONG's</h1>
  <p>Click a circle to open its page.</p>
  <div class="bubbles" id="bubbles"></div>
  <ul class="legend" id="legend" aria-label="색상별 분류"></ul>
  <a class="down" href="#all">전체 목록 보기</a>
</header>

<div class="top" id="all">
  <h2>전체 목록</h2>
  <p>직접 만든 HTML 페이지 <span id="total"></span>개를 분류별로 모았습니다.</p>
  <input class="search" id="search" type="search" placeholder="제목, 설명, 태그로 검색" aria-label="검색">
</div>

<div class="layout">
  <nav class="nav" aria-label="분류 목차"><ul id="navList"></ul></nav>
  <main>
    <div class="chips" id="chips" role="group" aria-label="태그 필터"></div>
    <div id="catalog"></div>
    <p class="empty" id="empty">검색 결과가 없습니다. 다른 단어로 검색하거나 선택한 태그를 해제하세요.</p>
  </main>
</div>

<footer><a href="https://github.com/LeesuY008" target="_blank" rel="noopener">GitHub 프로필</a></footer>
<button class="to-top" id="toTop" type="button">맨 위로</button>

<script>
/* =====================================================
   여기만 수정하면 됩니다. 페이지를 추가할 때는 { ... }, 블록을 복사해서 붙여넣으세요.
   title    : 카드 제목
   desc     : 한 줄 설명
   href     : 파일 경로 (예: "page1.html", "docs/page3.html")
   category : 분류 이름 (같은 이름끼리 한 구역으로 묶임)
   tags     : 태그 목록 (상단 필터 버튼으로 사용됨)
   date     : 표시할 날짜 (선택)
   preview  : true면 실제 페이지가 카드에 미리보기로 뜸, false면 글자 표시
   ===================================================== */
const items = [
  /* ---------- 프로젝트 ---------- */
  { title: "HR 통합 시스템 만들어보기", desc: "인사(HR) 시스템 만들어보기", href: "hr-system.html#info",
    category: "프로젝트", tags: ["HR"], image: "images/hr-system.png", preview: false },
  { title: "한국 온라인 게임 점유율", desc: "대한민국 온라인 게임 정보 확인해보기", href: "Gameinfo.html",
    category: "프로젝트", tags: ["게임"], image: "images/game-info.png", preview: false },
  { title: "서울 시간대별 차량 이동량 지도", desc: "서울 요일별 교통량 확인", href: "seoul_traffic_maps.html",
    category: "프로젝트", tags: ["지도"], image: "car.png", preview: false },
  { title: "대한민국 창폐업률", desc: "대한민국 창폐업률 확인해보기", href: "startup-map.html",
    category: "프로젝트", tags: ["지도"], image: "mappoint.png", preview: false },
  { title: "프로젝트 추가 예정 5", desc: "추가될 페이지 자리입니다.", href: "#all",
    category: "프로젝트", tags: ["준비중"], preview: false },
  { title: "프로젝트 추가 예정 6", desc: "추가될 페이지 자리입니다.", href: "#all",
    category: "프로젝트", tags: ["준비중"], preview: false },
  /* ---------- 학습 자료 ---------- */
  /* ---------- 학습 자료 ---------- */
  { title: "함수·벡터 그래프", desc: "함수와 벡터 그래프 그려보기", href: "Drawgraf.html",
    category: "학습 자료", tags: ["그래프"], date: "2026.11", image: "images/drawgraf.png", preview: false },
  { title: "두 번째 페이지 제목", desc: "한 줄 설명을 적습니다.", href: "page2.html",
    category: "학습 자료", tags: ["통계"], date: "2026.11", image: "images/page2.png", preview: false },
  { title: "학습 자료 추가 예정 3", desc: "추가될 페이지 자리입니다.", href: "#all",
    category: "학습 자료", tags: ["준비중"], preview: false },
  { title: "학습 자료 추가 예정 4", desc: "추가될 페이지 자리입니다.", href: "#all",
    category: "학습 자료", tags: ["준비중"], preview: false },
  { title: "학습 자료 추가 예정 5", desc: "추가될 페이지 자리입니다.", href: "#all",
    category: "학습 자료", tags: ["준비중"], preview: false },
  { title: "학습 자료 추가 예정 6", desc: "추가될 페이지 자리입니다.", href: "#all",
    category: "학습 자료", tags: ["준비중"], preview: false }
];
/* ===================================================== */

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const slug = (name, i) => "cat-" + i;

const categories = [...new Set(items.map((x) => x.category))];
const allTags = [...new Set(items.flatMap((x) => x.tags || []))];
let activeTag = null;

$("#total").textContent = items.length;

/* 버블: 크기는 기준 대비 1.00~1.05배로 최대 5%만 차이 */
const SIZE = [1.00, 1.04, 1.02, 1.05, 1.03];
$("#bubbles").innerHTML = items.map((x, i) =>
  `<a class="bubble" href="${esc(x.href)}" title="${esc(x.desc)}"
      style="--k:${SIZE[i % SIZE.length]};--c:var(--c${categories.indexOf(x.category) % 6})"><span>${esc(x.title)}</span></a>`).join("");
$("#legend").innerHTML = categories.map((c, i) => `<li><i style="background:var(--c${i % 6})"></i>${esc(c)}</li>`).join("");

/* 카탈로그 그리기 */
$("#catalog").innerHTML = categories.map((cat, i) => {
  const cards = items.map((x, idx) => ({ x, idx })).filter((o) => o.x.category === cat).map(({ x, idx }) => `
    <article class="card" data-idx="${idx}">
      <div class="thumb">
        ${x.image
          ? `<img src="${esc(x.image)}" alt="${esc(x.title)} 미리보기" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:this.alt.charAt(0)}))">`
          : x.preview
            ? `<iframe src="${esc(x.href)}" loading="lazy" sandbox="allow-scripts" tabindex="-1" aria-hidden="true" title=""></iframe>`
            : `<div class="ph" aria-hidden="true">${esc(x.title.charAt(0))}</div>`}
      </div>
      <div class="body">
        <h3><a href="${esc(x.href)}">${esc(x.title)}</a></h3>
        <p>${esc(x.desc)}</p>
        <div class="meta">
          ${(x.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}
          ${x.date ? `<span>${esc(x.date)}</span>` : ""}
        </div>
      </div>
    </article>`).join("");
  return `<section id="${slug(cat, i)}" data-cat="${i}"><h2>${esc(cat)} <small></small></h2><div class="grid">${cards}</div></section>`;
}).join("");

/* 목차와 태그 버튼 */
$("#navList").innerHTML = categories.map((cat, i) =>
  `<li><a href="#${slug(cat, i)}" data-cat="${i}"><span>${esc(cat)}</span><span class="n"></span></a></li>`).join("");

$("#chips").innerHTML = allTags.map((t) =>
  `<button class="chip" type="button" aria-pressed="false" data-tag="${esc(t)}">${esc(t)}</button>`).join("");

/* 검색 + 태그 필터 */
function applyFilter() {
  const q = $("#search").value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".card").forEach((card) => {
    const x = items[card.dataset.idx];
    const text = [x.title, x.desc, x.category, ...(x.tags || [])].join(" ").toLowerCase();
    const ok = (!q || text.includes(q)) && (!activeTag || (x.tags || []).includes(activeTag));
    card.style.display = ok ? "" : "none";
    if (ok) shown++;
  });
  categories.forEach((_, i) => {
    const sec = document.querySelector(`section[data-cat="${i}"]`);
    const n = [...sec.querySelectorAll(".card")].filter((c) => c.style.display !== "none").length;
    sec.style.display = n ? "" : "none";
    sec.querySelector("h2 small").textContent = n + "개";
    const a = document.querySelector(`.nav a[data-cat="${i}"]`);
    a.parentElement.style.display = n ? "" : "none";
    a.querySelector(".n").textContent = n;
  });
  $("#empty").classList.toggle("show", shown === 0);
}
$("#search").addEventListener("input", applyFilter);
$("#chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  const same = activeTag === b.dataset.tag;
  activeTag = same ? null : b.dataset.tag;
  document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.tag === activeTag)));
  applyFilter();
});
applyFilter();

/* 미리보기 크기 맞추기: 1280px 화면을 카드 너비에 맞춰 축소 */
const ro = new ResizeObserver((entries) => entries.forEach((en) => {
  if (en.contentRect.width) en.target.style.setProperty("--s", en.contentRect.width / 1280);
}));
document.querySelectorAll(".thumb").forEach((t) => ro.observe(t));

/* 스크롤 위치에 따라 목차 강조 */
const links = [...document.querySelectorAll(".nav a")];
const spy = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (en.isIntersecting) {
      links.forEach((a) => a.classList.toggle("active", a.dataset.cat === en.target.dataset.cat));
      const act = document.querySelector(".nav a.active");
      if (act && window.innerWidth <= 760) act.scrollIntoView({ inline: "center", block: "nearest" });
    }
  });
}, { rootMargin: "-15% 0px -75% 0px" });
document.querySelectorAll("section").forEach((s) => spy.observe(s));

/* 진행 막대 + 맨 위로 버튼 */
const bar = $("#progress"), topBtn = $("#toTop");
let ticking = false;
function onScroll() {
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.transform = `scaleX(${h > 0 ? scrollY / h : 0})`;
  topBtn.classList.toggle("show", scrollY > 600);
  ticking = false;
}
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
topBtn.addEventListener("click", () => scrollTo({ top: 0 }));
onScroll();

/* ===== 버블 움직임: 말랑하게 튕기고, 부딪히면 찌그러졌다 돌아오는 젤리 느낌 ===== */
(function () {
  const field = $("#bubbles");
  const els = [...field.querySelectorAll(".bubble")];
  if (!els.length) return;

  const HARD = 10;      // 이 간격 안으로는 절대 겹치지 않음(px)
  const SOFT = 26;      // 이 간격부터 서로 살짝 밀어내기 시작(px)
  const REST = 0.9;     // 반발 계수(1에 가까울수록 통통 튐)
  const K = 170, C = 6.5;   // 찌그러짐 스프링: 세기, 감쇠(작을수록 오래 출렁임)
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, lastW = 0, balls = [], visible = true;

  /* 위치 + 찌그러짐. q는 '축 방향 찌그러짐'을 2배각 벡터로 담아 방향이 바뀌어도 부드럽게 이어짐 */
  function draw(b) {
    const s = Math.min(Math.hypot(b.qx, b.qy), 0.14);
    if (s < 0.002) { b.el.style.transform = `translate3d(${b.x}px,${b.y}px,0)`; return; }
    const th = Math.atan2(b.qy, b.qx) / 2;
    b.el.style.transform = `translate3d(${b.x}px,${b.y}px,0) rotate(${th}rad) scale(${1 - s},${1 + s}) rotate(${-th}rad)`;
  }

  function impact(b, speed, nx, ny) {              // 충돌 방향으로 눌렸다가 출렁이게 함
    if (b.hold) return;
    const v0 = Math.min(speed * 0.035, 2.2), a2 = 2 * Math.atan2(ny, nx);
    b.qvx += v0 * Math.cos(a2); b.qvy += v0 * Math.sin(a2);
  }

  function measure() {
    balls = els.map((el, i) => ({
      el, d: el.offsetWidth, r: el.offsetWidth / 2, x: 0, y: 0, vx: 0, vy: 0,
      qx: 0, qy: 0, qvx: 0, qvy: 0, sp: 34 + (i % 4) * 7, hold: false
    }));
    balls.forEach((b) => {
      const on = () => { b.hold = true; }, off = () => { b.hold = false; };
      b.el.addEventListener("pointerenter", on); b.el.addEventListener("pointerleave", off);
      b.el.addEventListener("focus", on);        b.el.addEventListener("blur", off);
    });
  }

  function place() {
    W = field.clientWidth; lastW = W;
    H = Math.max(360, Math.round(innerHeight * 0.55));
    for (let t = 0; t < 14; t++) {                // 자리가 모자라면 영역 높이를 늘려 다시 배치
      const placed = []; let ok = true;
      for (const b of balls) {
        let found = false;
        for (let k = 0; k < 400 && !found; k++) {
          const x = Math.random() * Math.max(0, W - b.d), y = Math.random() * Math.max(0, H - b.d);
          if (placed.every((o) => Math.hypot((x + b.r) - (o.x + o.r), (y + b.r) - (o.y + o.r)) >= b.r + o.r + SOFT)) { b.x = x; b.y = y; placed.push(b); found = true; }
        }
        if (!found) { ok = false; break; }
      }
      if (ok) break;
      H = Math.round(H * 1.2);
    }
    field.style.height = H + "px";
    balls.forEach((b) => {
      const a = Math.random() * Math.PI * 2; b.vx = Math.cos(a) * b.sp; b.vy = Math.sin(a) * b.sp;
      b.qx = b.qy = b.qvx = b.qvy = 0; draw(b);
    });
  }

  function walls(b) {
    if (b.x < 0)            { b.x = 0;          if (b.vx < 0) { impact(b, -b.vx,  1, 0); b.vx = -b.vx * REST; } }
    else if (b.x > W - b.d) { b.x = W - b.d;    if (b.vx > 0) { impact(b,  b.vx, -1, 0); b.vx = -b.vx * REST; } }
    if (b.y < 0)            { b.y = 0;          if (b.vy < 0) { impact(b, -b.vy,  0, 1); b.vy = -b.vy * REST; } }
    else if (b.y > H - b.d) { b.y = H - b.d;    if (b.vy > 0) { impact(b,  b.vy,  0,-1); b.vy = -b.vy * REST; } }
  }

  function step(dt) {
    for (const b of balls) if (!b.hold) { b.x += b.vx * dt; b.y += b.vy * dt; }

    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], c = balls[j];
        if (a.hold && c.hold) continue;
        const dx = (a.x + a.r) - (c.x + c.r), dy = (a.y + a.r) - (c.y + c.r);
        const dist = Math.hypot(dx, dy) || 0.01, nx = dx / dist, ny = dy / dist;
        const hard = a.r + c.r + HARD, soft = a.r + c.r + SOFT;
        if (dist >= soft) continue;

        if (pass === 0) {                          // 가까워지면 쿠션처럼 먼저 살짝 밀어냄
          const acc = 120 * Math.min((soft - dist) / (SOFT - HARD), 1.5) * dt;
          if (!a.hold) { a.vx += nx * acc; a.vy += ny * acc; }
          if (!c.hold) { c.vx -= nx * acc; c.vy -= ny * acc; }
        }
        if (dist >= hard) continue;

        const ov = hard - dist;                    // 겹침 해소 (절대 겹치지 않게)
        if (a.hold) { c.x -= nx * ov; c.y -= ny * ov; }
        else if (c.hold) { a.x += nx * ov; a.y += ny * ov; }
        else { a.x += nx * ov / 2; a.y += ny * ov / 2; c.x -= nx * ov / 2; c.y -= ny * ov / 2; }

        const rv = (a.vx - c.vx) * nx + (a.vy - c.vy) * ny;   // 음수면 서로 다가가는 중
        if (rv < 0) {
          const e = 1 + REST;
          if (a.hold)      { c.vx += e * rv * nx;       c.vy += e * rv * ny; }
          else if (c.hold) { a.vx -= e * rv * nx;       a.vy -= e * rv * ny; }
          else { a.vx -= e * rv * nx / 2; a.vy -= e * rv * ny / 2; c.vx += e * rv * nx / 2; c.vy += e * rv * ny / 2; }
          impact(a, -rv, nx, ny); impact(c, -rv, nx, ny);
        }
      }
      balls.forEach(walls);
    }

    for (const b of balls) {
      if (!b.hold) {                               // 살랑살랑 방향이 바뀌고, 속도는 서서히 원래대로
        b.vx += (Math.random() - 0.5) * 200 * dt; b.vy += (Math.random() - 0.5) * 200 * dt;
        const s = Math.hypot(b.vx, b.vy) || 1, f = 1 + (b.sp / s - 1) * Math.min(1, dt * 1.5);
        b.vx *= f; b.vy *= f;
      }
      b.qvx += (-K * b.qx - C * b.qvx) * dt; b.qvy += (-K * b.qy - C * b.qvy) * dt;   // 출렁이며 원래 모양으로
      b.qx += b.qvx * dt; b.qy += b.qvy * dt;
    }
  }

  let last = performance.now();
  function tick(t) {
    const dt = Math.min((t - last) / 1000, 0.05); last = t;
    if (visible) { step(dt); balls.forEach(draw); }
    requestAnimationFrame(tick);
  }

  measure(); place();
  if (!reduce) {
    new IntersectionObserver((e) => { visible = e[0].isIntersecting; }).observe(field);
    requestAnimationFrame(tick);
  }
  let timer;
  addEventListener("resize", () => {              // 가로 폭이 바뀔 때만 다시 배치(모바일 주소창 변화는 무시)
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (Math.abs(field.clientWidth - lastW) < 2) return;
      balls.forEach((b) => { b.hold = false; b.d = b.el.offsetWidth; b.r = b.d / 2; });
      place();
    }, 200);
  });
})();
</script>
</body>
</html>
