name: 로또 당첨번호 자동 업데이트

on:
  schedule:
    # 매주 일요일 09:00 (한국 시간) = 일요일 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:   # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 새 회차 받기
        run: python3 scripts/update_lotto_data.py lotto_data.js

      - name: 바뀐 내용이 있으면 커밋
        run: |
          if git diff --quiet lotto_data.js; then
            echo "새 회차 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto_data.js
          git commit -m "로또 당첨번호 자동 업데이트"
          git push
          # 봇이 올린 커밋도 사이트에 바로 반영되도록 배포 요청
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
