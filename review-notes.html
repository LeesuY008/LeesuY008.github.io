<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>종합 복습노트</title>
<meta name="description" content="수업 자료를 각자의 Claude로 분석해 JSON으로 넣으면 과목·자료·파트별 복습, 퀴즈, 3D 연관 네트워크로 정리">
<style>
/* ===== 디자인 토큰 ===== */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efede8; --text:#1c1b19; --muted:#6b6862; --border:#e2dfd8;
  --accent:#2f5bd3; --accent-soft:#e7edfb;
  --bad:#c2410c; --bad-soft:#fdede4; --mid:#a16207; --mid-soft:#fbf3d9; --good:#15803d; --good-soft:#e3f4e8;
  --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#151514; --surface:#1e1e1c; --surface-2:#282826; --text:#ecebe7; --muted:#a09d96; --border:#353431;
    --accent:#7b9cf0; --accent-soft:#232c45;
    --bad:#f08a5d; --bad-soft:#3a2219; --mid:#e0b545; --mid-soft:#352c14; --good:#5cc985; --good-soft:#18301f;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}

/* ===== 상단바 ===== */
header{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 16px;
  background:var(--surface);border-bottom:1px solid var(--border)}
header h1{font-size:17px;margin:0;white-space:nowrap;cursor:pointer}
.search{flex:1;min-width:0;max-width:420px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.spacer{flex:1}
.btn{padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:3px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
#menuBtn{display:none}
#backBtn{font-size:16px;line-height:1;padding:7px 11px}
#backBtn:disabled{opacity:.35;cursor:default;background:var(--surface)}
.backdrop{display:none}

/* ===== 레이아웃 ===== */
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 55px)}
aside{border-right:1px solid var(--border);padding:14px 10px;background:var(--surface)}
main{padding:24px 28px 80px;max-width:900px;width:100%}
.nav-item{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:7px;font-size:14px}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-subject{font-weight:600;margin-top:10px}
.nav-lecture{padding-left:22px;color:var(--muted)}
.nav-lecture.active{color:var(--accent)}
.nav-group{padding-left:16px;font-size:13.5px}
.nav-lecture.in-group{padding-left:36px;font-size:13px}
.group-box{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--surface-2)}
.group-head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;margin-bottom:6px}
.group-head:hover .card-title{color:var(--accent)}
.card.in-group{margin-left:10px;margin-top:10px}
.side-tools{border-top:1px solid var(--border);margin-top:16px;padding-top:12px;display:flex;flex-direction:column;gap:6px}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 10px}

/* ===== 본문 요소 ===== */
h2{font-size:24px;margin:4px 0 6px}
h3{font-size:17px;margin:28px 0 10px;display:flex;align-items:center;gap:8px}
.crumb{color:var(--muted);font-size:13px}
.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card-title{font-weight:600}
.muted{color:var(--muted)}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.sample{background:var(--mid-soft);color:var(--mid)}
.stars{color:var(--mid);font-size:13px;letter-spacing:1px}
pre.formula{font-family:var(--mono);background:var(--surface-2);padding:8px 12px;border-radius:8px;white-space:pre-wrap;margin:8px 0 0;font-size:14px}
.example{margin-top:8px;font-size:14px;color:var(--muted);border-left:3px solid var(--border);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.clickable{cursor:pointer}
.clickable:hover{border-color:var(--accent)}
.stat{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px;display:flex}
.bar span{display:block;height:100%}
.term-row{display:grid;grid-template-columns:160px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:start}
.term-row:last-child{border-bottom:0}
details{margin-top:10px}
details summary{cursor:pointer;color:var(--accent);font-size:14px}
.answer{margin-top:6px;padding:10px 12px;background:var(--good-soft);border-radius:8px}
ol.choices{margin:8px 0 0;padding-left:22px}

/* 복습 상태 버튼 */
.status{display:inline-flex;gap:4px;flex-shrink:0}
.status button{border:1px solid var(--border);background:var(--surface);border-radius:99px;font-size:12px;padding:1px 9px;color:var(--muted)}
.status button.on-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.status button.on-mid{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.status button.on-good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.hidden-know .is-good{display:none}

.empty{padding:40px;text-align:center;color:var(--muted)}
mark{background:var(--mid-soft);color:inherit;padding:0 2px;border-radius:3px}

/* ===== 출처 ===== */
.source-box{margin-top:32px;padding:14px 16px;border:1px dashed var(--border);border-radius:var(--radius);font-size:14px;background:var(--surface-2)}
.source-title{font-weight:600;margin-bottom:6px}
.source-box .stat{display:inline-block;min-width:64px}
.source-notice{margin-top:8px;color:var(--bad);font-weight:600}

/* ===== 3D 연관 네트워크 ===== */
main.wide{max-width:none}
.g-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.g-controls select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.g-controls label{font-size:13px;display:flex;gap:6px;align-items:center}
.graph-wrap{position:relative;height:calc(100vh - 230px);min-height:420px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
#graph{position:absolute;inset:0}
.graph-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}
.graph-panel{position:absolute;top:12px;right:12px;width:280px;max-height:calc(100% - 24px);overflow:auto;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.12);display:none}
.graph-panel.open{display:block}
.graph-panel .nb{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 6px;border-radius:6px;font-size:13px}
.graph-panel .nb:hover{background:var(--surface-2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.g-tip{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-size:13px;font-family:var(--font)}
.graph-wrap.compact{height:480px;min-height:0}
.graph-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.graph-wrap{background:radial-gradient(ellipse at 50% 42%, var(--surface) 0%, var(--surface) 35%, var(--surface-2) 100%)}
.glabel{position:absolute;left:0;top:0;white-space:normal;text-align:center;line-height:1.3;transform-origin:0 0;
  background:color-mix(in srgb, var(--surface) 90%, transparent);border:1px solid var(--border);border-radius:8px;color:var(--text);transition:opacity .25s}
.glabel.con{background:none;border:0;border-radius:0;padding:0;font-size:11px;white-space:nowrap;color:var(--text);
  text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 2px var(--surface),0 0 1px var(--surface)}
.glabel.con.key{font-weight:700;font-size:12px}
.glabel.con.term{color:var(--muted);font-style:italic}
.lline{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend-break{flex-basis:100%;height:0}
.glabel.subj{font-size:17px;font-weight:700;padding:6px 14px;max-width:240px;border-color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.12);z-index:2}
.glabel.lec{font-size:11.5px;padding:3px 8px;max-width:170px}
.glabel.grp{font-size:13px;font-weight:700;padding:4px 10px;max-width:180px;border-color:var(--muted);z-index:1}
.glabel.grp span{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.glabel.lec b{display:block}
.glabel.lec span{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
.glabel.lec.mini span{display:none}
.quiz-cta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0;padding:12px 16px;
  border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
@media (max-width:820px){
  .graph-wrap{height:calc(100vh - 260px)}
  .graph-wrap.compact{height:400px}
  .glabel.lec{max-width:140px;font-size:11px}
  .graph-panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:45%}
}

/* ===== 모달 ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:720px;max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin-top:0}
.modal textarea{width:100%;min-height:220px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-family:var(--mono);font-size:13px}
.modal input[type=text]{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.msg{margin-top:12px;font-size:14px;border-radius:8px;padding:10px 12px;display:none}
.msg.err{display:block;background:var(--bad-soft);color:var(--bad)}
.msg.ok{display:block;background:var(--good-soft);color:var(--good)}
.msg ul{margin:4px 0 0;padding-left:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

/* ===== 모바일 ===== */
@media (max-width:820px){
  #menuBtn{display:inline-block}
  header h1{font-size:15px}
  .hide-mobile{display:none}
  .layout{grid-template-columns:1fr}
  aside{position:fixed;top:55px;left:0;bottom:0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s;overflow:auto}
  aside.open{transform:none;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  .backdrop.open{display:block;position:fixed;top:55px;left:0;right:0;bottom:0;background:rgba(0,0,0,.25);z-index:25}
  main{padding:18px 16px 80px}
  .term-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <button class="btn" id="menuBtn" data-act="toggle-sidebar" aria-label="메뉴">☰</button>
  <button class="btn" id="backBtn" data-act="back" aria-label="뒤로가기" title="뒤로가기" disabled>←</button>
  <h1 data-act="nav" data-view="overview" title="전체 개요">📚<span class="hide-mobile"> 종합 복습노트</span></h1>
  <input class="search" id="search" type="search" placeholder="전체 검색 (개념·용어·퀴즈)">
  <div class="spacer hide-mobile"></div>
  <button class="btn hide-mobile" data-act="open-prompt">분석 프롬프트</button>
  <button class="btn primary" data-act="open-import">+ 자료 추가</button>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<div class="backdrop" id="backdrop"></div>

<!-- 자료 추가 모달 -->
<div class="modal-bg" id="importModal">
  <div class="modal">
    <h3>자료 추가 (JSON 붙여넣기)</h3>
    <p class="muted" style="margin:0 0 10px;font-size:14px">
      Claude에게 수업 자료와 <a href="#" data-act="open-prompt">분석 프롬프트</a>를 함께 주고, 결과 JSON을 아래에 붙여넣으세요.
      코드블록(```json)째로 붙여도 됩니다. 백업 파일도 여기서 불러올 수 있어요.
    </p>
    <textarea id="importText" placeholder='{ "schema_version": 1, "subject": "...", "lecture": {...}, ... }'></textarea>
    <div class="row">
      <input type="file" id="importFile" accept=".json,application/json,text/plain">
    </div>
    <div class="row" id="subjectRow" style="display:none">
      <span style="white-space:nowrap">과목명</span>
      <input type="text" id="importSubject" list="subjectList" placeholder="기존 과목에서 고르거나 새로 입력">
      <datalist id="subjectList"></datalist>
    </div>
    <div class="msg" id="importMsg"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" data-act="close-modal">닫기</button>
      <button class="btn" data-act="check-import">검사하기</button>
      <button class="btn primary" data-act="do-import" id="doImportBtn" disabled>추가하기</button>
    </div>
  </div>
</div>

<!-- 분석 프롬프트 모달 -->
<div class="modal-bg" id="promptModal">
  <div class="modal">
    <h3>분석 프롬프트</h3>
    <p class="muted" style="margin:0 0 10px;font-size:14px">
      아래 프롬프트를 복사해서 수업 자료(PDF·PPT)와 함께 <b>본인의 Claude</b>에 보내세요. 결과 JSON을 [자료 추가]에 붙여넣으면 됩니다.
    </p>
    <textarea id="promptText" readonly style="min-height:320px"></textarea>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" data-act="close-modal">닫기</button>
      <button class="btn primary" data-act="copy-prompt">복사하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 이 컴퓨터에만 있는 분석 결과(있으면 자동으로 불러옴). 이 폴더는 외부에 올리지 마세요 -->
<script>
/* =========================================================
   1. 스키마 & 분석 프롬프트
   ========================================================= */
const SCHEMA_VERSION = 1;
const STORE_KEY = 'review-notes-v1';
const QUIZ_TYPES = ['객관식', '단답', '서술'];

const PROMPT = `첨부한 수업 자료를 분석해서, 아래 스키마에 정확히 맞는 JSON만 출력해줘.
설명 문장 없이 \`\`\`json 코드블록 하나만 출력해.

[작성 규칙]
- 자료에 있는 내용을 기준으로 작성하고, 자료에 없는 내용은 지어내지 마.
- 자료가 Part·장으로 나뉘어 있고 분량이 많으면(대략 100쪽 이상), Part마다 아래 형식의 객체를 하나씩 만들어
  JSON 배열 [ {...}, {...} ]로 출력해. lecture.title에 Part 이름을 넣고, source.pages에는 그 Part의 쪽 범위를 적어.
  명시적인 Part 구분이 없으면 주제가 바뀌는 지점에서 2~3개로 나눠.
- summary: 강의 전체를 3~5문장으로 요약
- concepts: 핵심 개념 5~12개. importance는 1(참고)~3(시험에 꼭 나올 것)
- formula: 수식이 있는 개념만. 없으면 생략
- related: 이 개념과 직접 연결되는 다른 개념 이름 0~3개.
  같은 자료의 concepts에 있는 개념이면 name과 글자 하나까지 똑같이 적어.
  다른 강의·과목에서 배웠을 법한 개념이면 가장 일반적인 이름으로 적어.
- terms: 처음 보는 사람이 헷갈릴 용어 위주
- quizzes: 5~10개. type은 "객관식" | "단답" | "서술" 중 하나.
  객관식이면 choices 배열을 넣고 answer에는 정답 보기의 내용을 그대로 적어.
- pages: 그 개념이 나온 쪽수 (예: "p.74–89"). 모르면 생략
- source: 출처. 자료에 적힌 제목·저자·소속·저작권 표시를 그대로 옮겨 적어.
  자료에 없는 정보는 지어내지 말고 생략해.
- week: 주차를 알 수 없으면 null.
- group: 한 파일을 Part별로 나눴다면 모든 Part에 같은 자료 이름(예: "강의노트 1")을 넣고,
  title에는 그 Part 이름만 적어. 나누지 않았으면 생략.
- 모든 텍스트는 한국어로.

[스키마]
{
  "schema_version": 1,
  "subject": "과목명",
  "semester": "2026-2 (선택)",
  "professor": "교수명 (선택)",
  "lecture": {
    "week": 5,
    "group": "자료 묶음 이름 (선택, 예: 강의노트 1)",
    "title": "강의 제목",
    "source_file": "원본 파일명 (선택)",
    "summary": "강의 요약"
  },
  "source": {
    "title": "자료 제목",
    "author": "저자/교수",
    "institution": "소속 (선택)",
    "copyright": "자료에 적힌 저작권 표시 (선택)",
    "pages": "분석한 쪽 범위 (선택)",
    "notice": "이용 제한 등 메모 (선택)"
  },
  "concepts": [
    { "name": "개념명", "explanation": "설명", "formula": "수식 (선택)", "example": "예시 (선택)", "importance": 3, "related": ["연관 개념명 (선택)"], "pages": "p.12–15 (선택)" }
  ],
  "terms": [
    { "term": "용어", "definition": "정의" }
  ],
  "quizzes": [

/* =========================================================
   2. 저장소 (브라우저 localStorage)
   db = { schema_version, subjects:[], lectures:[{..., concepts, terms, quizzes}], progress:{ itemId: {s, t} } }
   ========================================================= */
let db; // 맨 아래에서 load()로 채움 (헬퍼 함수 정의 후)
const ui = { view: 'overview', id: null, query: '', hideKnow: false };

function load() {
  let d = null;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const x = JSON.parse(raw); if (x && Array.isArray(x.lectures)) d = x; }
  } catch (e) {}
  if (!d) d = emptyDb();
  const pre = Array.isArray(window.PRELOAD_NOTES) ? window.PRELOAD_NOTES : [];
  if (pre.length) {
    d.lectures = d.lectures.filter(l => !l.sample); // 실제 자료가 있으면 샘플은 숨김
    d.subjects = d.subjects.filter(s => d.lectures.some(l => l.subject_id === s.id));
    let added = 0;
    pre.forEach(o => {
      const name = str(o.subject) || '미분류', title = str(o.lecture && o.lecture.title), group = str(o.lecture && o.lecture.group);
      const s = d.subjects.find(x => x.name === name);
      const old = s && d.lectures.find(l => l.subject_id === s.id && (l.title === title || (group && l.title === group + ' · ' + title)));
      if (old) { // 이미 있음 → 묶음 정보만 맞춰 줌 (복습 체크 기록은 그대로)
        if (old.title !== title || (old.group || '') !== group) { old.title = title; old.group = group; added++; }
        return;
      }
      addLecture(d, o, name, false); added++;
    });
    if (added) { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) {} }
  } else if (!d.lectures.length) {
    addLecture(d, SAMPLE, SAMPLE.subject, true);
    addLecture(d, SAMPLE2, SAMPLE2.subject, true);
  }
  return d;
}
function emptyDb() { return { schema_version: SCHEMA_VERSION, subjects: [], lectures: [], progress: {} }; }
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch (e) { toast('저장 실패: 이 브라우저에서는 저장소를 쓸 수 없어요. [백업 내보내기]를 이용하세요.'); }
}

let _n = 0;
const uid = p => p + Date.now().toString(36) + (_n++).toString(36) + Math.random().toString(36).slice(2, 5);
const str = v => (v == null ? '' : String(v)).trim();

function addLecture(d, obj, subjectName, isSample) {
  let subj = d.subjects.find(s => s.name === subjectName);
  if (!subj) {
    subj = { id: uid('s'), name: subjectName, semester: str(obj.semester), professor: str(obj.professor) };
    d.subjects.push(subj);
  }
  const L = obj.lecture || {};
  const lec = {
    id: uid('l'), subject_id: subj.id,
    week: Number.isFinite(+L.week) && L.week !== '' && L.week != null ? +L.week : null,
    title: str(L.title), group: str(L.group), source_file: str(L.source_file), summary: str(L.summary),
    sample: !!isSample, added: Date.now(),
    source: (() => {
      const s = obj.source && typeof obj.source === 'object' ? obj.source : {};
      const o = {};
      ['title', 'author', 'institution', 'copyright', 'pages', 'notice'].forEach(k => { if (str(s[k])) o[k] = str(s[k]); });
      return o;
    })(),
    concepts: (obj.concepts || []).map(c => ({
      id: uid('c'), name: str(c.name), explanation: str(c.explanation),
      formula: str(c.formula), example: str(c.example),
      importance: Math.min(3, Math.max(1, parseInt(c.importance) || 2)),
      related: Array.isArray(c.related) ? c.related.map(str).filter(Boolean) : [],
      pages: str(c.pages)
    })),
    terms: (obj.terms || []).map(t => ({ id: uid('t'), term: str(t.term), definition: str(t.definition) })),
    quizzes: (obj.quizzes || []).map(q => ({
      id: uid('q'), type: QUIZ_TYPES.includes(q.type) ? q.type : '단답',
      question: str(q.question), choices: Array.isArray(q.choices) ? q.choices.map(str) : [],
      answer: str(q.answer), explanation: str(q.explanation)
    }))
  };
  d.lectures.push(lec);
  return lec;
}

/* =========================================================
   3. 스키마 검증
   ========================================================= */
function parseInput(text) {
  const t = text.trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  return JSON.parse(fence ? fence[1] : t);
}

function validate(obj, idx) {
  const errors = [], warnings = [];
  const at = idx != null ? `[${idx + 1}번째 자료] ` : '';
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { errors: [at + 'JSON 객체가 아닙니다.'], warnings };
  if (obj.schema_version && obj.schema_version > SCHEMA_VERSION) warnings.push(at + `schema_version ${obj.schema_version}은 이 페이지(v${SCHEMA_VERSION})보다 최신입니다.`);
  if (!obj.lecture || typeof obj.lecture !== 'object') errors.push(at + 'lecture 항목이 없습니다.');
  else if (!str(obj.lecture.title)) errors.push(at + 'lecture.title(강의 제목)이 비어 있습니다.');

  const checkArr = (key, req, label) => {
    if (obj[key] == null) return;
    if (!Array.isArray(obj[key])) { errors.push(at + `${key}는 배열이어야 합니다.`); return; }
    obj[key].forEach((it, i) => {
      const miss = req.filter(f => !it || !str(it[f]));
      if (miss.length) errors.push(at + `${label} ${i + 1}번: ${miss.join(', ')} 없음`);
    });
  };
  checkArr('concepts', ['name', 'explanation'], '개념');
  checkArr('terms', ['term', 'definition'], '용어');
  checkArr('quizzes', ['question', 'answer'], '퀴즈');
  (Array.isArray(obj.concepts) ? obj.concepts : []).forEach((c, i) => {
    if (c && c.related != null && !Array.isArray(c.related)) warnings.push(at + `개념 ${i + 1}번: related는 배열이어야 해서 무시합니다`);
  });
  (Array.isArray(obj.quizzes) ? obj.quizzes : []).forEach((q, i) => {
    if (q && q.type && !QUIZ_TYPES.includes(q.type)) warnings.push(at + `퀴즈 ${i + 1}번: type "${q.type}" → "단답"으로 처리`);
    if (q && q.type === '객관식' && !Array.isArray(q.choices)) warnings.push(at + `퀴즈 ${i + 1}번: 객관식인데 choices가 없음`);
  });
  if (!obj.source || typeof obj.source !== 'object' || !['title', 'author'].some(k => str(obj.source[k])))
    warnings.push(at + '출처(source)가 없어요. 분석 아래에 출처가 표시되지 않습니다.');
  const total = ['concepts', 'terms', 'quizzes'].reduce((n, k) => n + (Array.isArray(obj[k]) ? obj[k].length : 0), 0);
  if (!total) warnings.push(at + '개념·용어·퀴즈가 모두 비어 있습니다.');
  return { errors, warnings };
}

/* =========================================================
   4. 조회 헬퍼
   ========================================================= */
const subjOf = id => db.subjects.find(s => s.id === id);
const lecOf = id => db.lectures.find(l => l.id === id);
const lecturesOf = sid => db.lectures.filter(l => l.subject_id === sid)
  .sort((a, b) => (a.week ?? 999) - (b.week ?? 999) || a.added - b.added);
const itemIds = l => [...l.concepts, ...l.terms, ...l.quizzes].map(x => x.id);
const statusOf = id => (db.progress[id] || {}).s || '';

function progressOf(lectures) {
  const ids = lectures.flatMap(itemIds);
  const c = { total: ids.length, good: 0, mid: 0, bad: 0 };
  ids.forEach(id => { const s = statusOf(id); if (c[s] != null) c[s]++; });
  return c;
}

function allItems() {
  return db.lectures.flatMap(l => [
    ...l.concepts.map(x => ({ kind: '개념', id: x.id, label: x.name, body: x.explanation + ' ' + x.formula + ' ' + x.example, lec: l })),
    ...l.terms.map(x => ({ kind: '용어', id: x.id, label: x.term, body: x.definition, lec: l })),
    ...l.quizzes.map(x => ({ kind: '퀴즈', id: x.id, label: x.question, body: x.answer + ' ' + x.explanation + ' ' + x.choices.join(' '), lec: l }))
  ]);
}

/* =========================================================
   5. 렌더링
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const weekLabel = l => l.week != null ? `${l.week}주차` : '';
const lecName = l => [weekLabel(l), l.title].filter(Boolean).join(' · '); // 주차가 없으면 제목만
const lecFull = l => [l.group, lecName(l)].filter(Boolean).join(' · ');    // 묶음 이름까지
/* 자료 묶음 (예: 강의노트 1 → Part I, Part II). id = "g|과목id|묶음이름" */
const groupId = (sid, name) => 'g|' + sid + '|' + name;
function parseGroupId(id) {
  if (typeof id !== 'string' || !id.startsWith('g|')) return null;
  const i = id.indexOf('|', 2);
  return i < 0 ? null : { sid: id.slice(2, i), name: id.slice(i + 1) };
}
function groupsOf(sid) { // 강의 순서대로 묶음 목록. 묶음이 없는 강의는 name ''
  const out = [], m = new Map();
  lecturesOf(sid).forEach(l => {
    const g = l.group || '';
    if (!m.has(g)) { const o = { id: groupId(sid, g), name: g, sid, lectures: [] }; m.set(g, o); out.push(o); }
    m.get(g).lectures.push(l);
  });
  return out;
}
const groupOf = id => { const p = parseGroupId(id); return p && p.name && subjOf(p.sid) ? groupsOf(p.sid).find(g => g.name === p.name) || null : null; };

function render() {
  renderSidebar();
  const m = $('main');
  m.classList.toggle('hidden-know', ui.hideKnow);
  const openQ = [...m.querySelectorAll('details[open][data-q]')].map(d => d.dataset.q); // 펼쳐 둔 정답 유지
  destroyGraph();
  const isGraph = !ui.query && ui.view === 'graph';
  m.classList.toggle('wide', isGraph);
  if (isGraph) { gs.group = null; m.innerHTML = viewGraph(); mountGraph(); return; }
  if (ui.query) m.innerHTML = viewSearch();
  else if (ui.view === 'lecture' && lecOf(ui.id)) m.innerHTML = viewLecture(lecOf(ui.id));
  else if (ui.view === 'group' && groupOf(ui.id)) {
    const g = groupOf(ui.id);
    gs.subject = g.sid; gs.group = g.name;
    if (gs.colorBy === 'subject') gs.colorBy = 'lecture';
    m.innerHTML = viewGroup(g);
    mountGraph();
  }
  else if (ui.view === 'subject' && subjOf(ui.id)) {
    gs.subject = ui.id; gs.group = null;
    if (gs.colorBy === 'subject') gs.colorBy = 'lecture'; // 과목 하나만 보면 강의별 색이 유용
    m.innerHTML = viewSubject(subjOf(ui.id));
    mountGraph();
  }
  else if (ui.view === 'quiz') m.innerHTML = viewQuiz();
  else { ui.view = 'overview'; m.innerHTML = viewOverview(); }
  openQ.forEach(id => { const d = m.querySelector(`details[data-q="${id}"]`); if (d) d.open = true; });
}

function renderSidebar() {
  const a = (view, id, label, cls) =>
    `<button class="nav-item ${cls} ${!ui.query && ui.view === view && (view === 'quiz' || ui.id === id) ? 'active' : ''}" data-act="nav" data-view="${view}" data-id="${id || ''}">${label}</button>`;
  let h = a('overview', null, '🏠 전체 개요', '') + a('graph', null, '🕸 연관 네트워크 (3D)', '') + a('quiz', null, '📝 퀴즈', '');
  db.subjects.forEach(s => {
    h += a('subject', s.id, esc(s.name), 'nav-subject');
    groupsOf(s.id).forEach(g => {
      if (g.name) h += a('group', g.id, '📁 ' + esc(g.name), 'nav-group');
      g.lectures.forEach(l => h += a('lecture', l.id, esc(lecName(l)), g.name ? 'nav-lecture in-group' : 'nav-lecture'));
    });
  });
  h += `<div class="side-tools">
    <label class="check"><input type="checkbox" data-act="hide-know" ${ui.hideKnow ? 'checked' : ''}> '앎' 항목 숨기기</label>
    <button class="btn small" data-act="open-prompt">분석 프롬프트 보기</button>
    <button class="btn small" data-act="export">백업 내보내기 (JSON)</button>
  </div>`;
  $('sidebar').innerHTML = h;
}

function progressBar(p) {
  if (!p.total) return '';
  const w = n => (n / p.total * 100).toFixed(1) + '%';
  return `<div class="bar"><span style="width:${w(p.good)};background:var(--good)"></span><span style="width:${w(p.mid)};background:var(--mid)"></span><span style="width:${w(p.bad)};background:var(--bad)"></span></div>
    <div class="stat" style="margin-top:4px">앎 ${p.good} · 애매 ${p.mid} · 모름 ${p.bad} · 미체크 ${p.total - p.good - p.mid - p.bad}</div>`;
}

function viewOverview() {
  if (!db.lectures.length) return `<div class="empty">아직 자료가 없어요.<br><br><button class="btn primary" data-act="open-import">+ 첫 자료 추가하기</button></div>`;
  let h = `<h2>전체 개요</h2><div class="meta">과목 ${db.subjects.length}개 · 강의 ${db.lectures.length}개</div><h3>과목</h3><div class="grid">`;
  db.subjects.forEach(s => {
    const ls = lecturesOf(s.id);
    h += `<div class="card clickable" data-act="nav" data-view="subject" data-id="${s.id}">
      <div class="card-title">${esc(s.name)}</div>
      <div class="stat">강의 ${ls.length} · 개념 ${ls.reduce((n, l) => n + l.concepts.length, 0)} · 퀴즈 ${ls.reduce((n, l) => n + l.quizzes.length, 0)}</div>
      ${progressBar(progressOf(ls))}</div>`;
  });
  h += `</div>`;
  const weak = allItems().filter(i => statusOf(i.id) === 'bad');
  h += `<h3>🔥 복습 필요 (모름) <span class="badge">${weak.length}</span></h3>`;
  h += weak.length ? weak.map(itemLink).join('') : `<p class="muted">'모름'으로 체크한 항목이 여기에 모여요.</p>`;
  return h;
}

function lecCard(l, extraCls = '') {
  return `<div class="card clickable ${extraCls}" data-act="nav" data-view="lecture" data-id="${l.id}">
    <div class="card-head"><div class="card-title">${esc(lecName(l))}</div>${l.sample ? '<span class="badge sample">샘플</span>' : ''}</div>
    <div class="muted" style="font-size:14px">${esc(l.summary).slice(0, 140)}${l.summary.length > 140 ? '…' : ''}</div>
    ${progressBar(progressOf([l]))}</div>`;
}
function termsBlock(ls, label) {
  const terms = ls.flatMap(l => l.terms.map(t => ({ t, l }))).sort((a, b) => a.t.term.localeCompare(b.t.term, 'ko'));
  if (!terms.length) return '';
  let h = `<h3>${label} 용어 모아보기 <span class="badge">${terms.length}</span></h3><div class="card">`;
  terms.forEach(({ t, l }) => h += termRow(t, `<div class="stat">${esc(weekLabel(l) || l.title)}</div>`));
  return h + `</div>`;
}
const countStat = ls => `파트 ${ls.length} · 개념 ${ls.reduce((n, l) => n + l.concepts.length, 0)} · 퀴즈 ${ls.reduce((n, l) => n + l.quizzes.length, 0)}`;

function viewSubject(s) {
  const ls = lecturesOf(s.id), groups = groupsOf(s.id);
  let h = `<div class="crumb">과목</div><h2>${esc(s.name)}</h2>
    <div class="meta">${[s.semester, s.professor].filter(Boolean).map(esc).join(' · ')}</div>${progressBar(progressOf(ls))}

  groups.forEach(g => {
    if (!g.name) { g.lectures.forEach(l => h += lecCard(l)); return; }
    h += `<div class="group-box">
      <div class="group-head clickable" data-act="nav" data-view="group" data-id="${esc(g.id)}">

}

function viewQuiz() {
  if (qs.subject !== 'all' && !subjOf(qs.subject)) qs.subject = 'all';
  if (qs.lecture !== 'all' && !lecOf(qs.lecture) && !groupOf(qs.lecture)) qs.lecture = 'all';
  const lecs = db.lectures.filter(l => (qs.subject === 'all' || l.subject_id === qs.subject) &&
    (qs.lecture === 'all' || l.id === qs.lecture || (l.group && groupId(l.subject_id, l.group) === qs.lecture)));
  let list = (qs.subject === 'all' ? db.subjects : [subjOf(qs.subject)])
    .flatMap(s => lecturesOf(s.id)).filter(l => lecs.includes(l))

  }

    : g.lectures.map(l => opt(l.id, esc(lecName(l)), qs.lecture)).join('')).join('');
  let h = `<h2>📝 퀴즈</h2>
    <div class="meta">${list.length}문제 · 앎 ${c.good} · 애매 ${c.mid} · 모름 ${c.bad} · 미체크 ${list.length - c.good - c.mid - c.bad}</div>
    <div class="g-controls">
      <select data-qz="subject">${opt('all', '모든 과목', qs.subject)}${db.subjects.map(s => opt(s.id, esc(s.name), qs.subject)).join('')}</select>
      <select data-qz="lecture" ${qs.subject === 'all' ? 'disabled' : ''}>${opt('all', '모든 강의', qs.lecture)}${lecOptions}</select>
      <button class="btn small" data-act="quiz-shuffle">🔀 섞기</button>
      ${qs.order ? `<button class="btn small" data-act="quiz-unshuffle">순서대로</button>` : ''}
      <button class="btn small" data-act="quiz-collapse">정답 모두 접기</button>
    </div>
    <p class="stat" style="margin:0 0 12px">사이드바의 '앎' 항목 숨기기를 켜면 아직 모르는 문제만 남습니다.</p>`;
  h += list.length ? list.map(({ q, l }, i) => quizCard(q, i, l)).join('') : `<div class="empty">조건에 맞는 퀴즈가 없어요.</div>`;
  return h;
}

function itemLink(i) {

function termRow(t, extra = '') {

}
const cls = id => statusOf(id) === 'good' ? 'is-good' : '';
function statusBtns(id) {
  const s = statusOf(id);
  const b = (v, label) => `<button data-act="status" data-item="${id}" data-s="${v}" class="${s === v ? 'on-' + v : ''}">${label}</button>`;
  return `<span class="status">${b('bad', '모름')}${b('mid', '애매')}${b('good', '앎')}</span>`;

/* =========================================================
   5-2. 3D 연관 네트워크
   - 노드: 과목(큰 점) → 강의(중간) → 개념/용어(작은 점)
   - 연관 링크 3종: ① Claude가 적은 related ② 같은 이름의 개념 ③ 설명에 다른 개념 이름이 등장
   - 복잡도 줄이기: 중요도 필터, 과목 필터, 용어 기본 숨김, 라벨은 마우스 올릴 때만,
     노드 클릭 시 이웃만 강조하고 나머지는 흐리게
   ========================================================= */
const GRAPH_LIB = 'https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.4/dist/3d-force-graph.min.js';
const PALETTE = ['#4e79a7', '#f28e2b', '#59a14f', '#e15759', '#b07aa1', '#76b7b2', '#edc948', '#ff9da7'];
const STATUS_COLOR = { bad: '#e4572e', mid: '#e0a526', good: '#3aa864', '': '#9a9a9a' };
const CROSS_COLOR = '#d63384';
const TYPE_LABEL = { subject: '과목', group: '자료 묶음', lecture: '파트', concept: '개념', term: '용어' };
const gs = { subject: 'all', group: null, minImp: 2, terms: false, colorBy: 'subject', focus: null, hover: null };
let G = null, gData = null, libPromise = null, mountToken = null;

const isDark = () => window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
const dimColor = () => isDark() ? '#2c2c2a' : '#e6e4de';
const treeColor = () => isDark() ? '#55534e' : '#c4c1b9';
const coreName = s => String(s || '').replace(/\(.*?\)/g, '').replace(/\s+/g, '').toLowerCase();
const subjColor = sid => PALETTE[Math.max(0, db.subjects.findIndex(s => s.id === sid)) % PALETTE.length];
const endId = e => typeof e === 'object' ? e.id : e;
const lecColor = lid => { const l = lecOf(lid); const i = l ? lecturesOf(l.subject_id).indexOf(l) : 0; return PALETTE[Math.max(0, i) % PALETTE.length]; };

function loadGraphLib() {
  if (window.ForceGraph3D) return Promise.resolve();
  if (!libPromise) libPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = GRAPH_LIB; s.onload = res; s.onerror = () => { libPromise = null; s.remove(); rej(); };
    document.head.appendChild(s);
  });
  return libPromise;
}
function destroyGraph() { stopLabels(); if (G) { try { G._destructor(); } catch (e) {} G = null; } mountToken = null; }

function buildGraph() {
  const nodes = [], links = [], byId = {}, adj = {};
  const add = n => { nodes.push(n); byId[n.id] = n; adj[n.id] = new Set(); };
  const link = (a, b, kind, extra) => { links.push(Object.assign({ source: a, target: b, kind }, extra)); adj[a].add(b); adj[b].add(a); };

  const subs = db.subjects.filter(s => gs.subject === 'all' || s.id === gs.subject);
  const single = subs.length === 1;
  let ringR = 0;
  subs.forEach(s => {
    const lecs = lecturesOf(s.id).filter(l => !gs.group || (l.group || '') === gs.group);
    // 가운데 점: 과목 화면이면 과목, 자료 묶음 화면이면 그 묶음
    const center = gs.group
      ? { id: groupId(s.id, gs.group), type: 'group', name: gs.group, subject: s.id, count: lecs.length }
      : { id: s.id, type: 'subject', name: s.name, subject: s.id };
    if (single) { center.fx = 0; center.fy = 0; center.fz = 0; center.center = true; }
    add(center);
    // 파트를 둘레에 배치. 묶음이 여러 개면 묶음 사이에 한 칸씩 띄워 덩어리로 보이게
    const groups = gs.group ? [] : groupsOf(s.id);
    const gaps = groups.length > 1 ? groups.length : 0;
    const R = 120 + 12 * lecs.length, slots = lecs.length + gaps, ang = {};
    let slot = 0, prev = null;
    lecs.forEach(l => {
      const g = l.group || '';
      if (gaps && prev !== null && g !== prev) slot++;
      prev = g; ang[l.id] = -Math.PI / 2 + (2 * Math.PI * slot++) / slots;
    });
    if (single) ringR = R;
    groups.filter(g => g.name).forEach(g => {
      const gn = { id: g.id, type: 'group', name: g.name, subject: s.id, count: g.lectures.length };
      if (single) { // 묶음 점은 자기 파트들 방향, 가운데와 파트 사이에
        const th = Math.atan2(g.lectures.reduce((n, l) => n + Math.sin(ang[l.id]), 0), g.lectures.reduce((n, l) => n + Math.cos(ang[l.id]), 0));
        gn.fx = 0.5 * R * Math.cos(th); gn.fy = -0.5 * R * Math.sin(th); gn.fz = 0;
      }
      add(gn);
      link(center.id, g.id, 'tree');
    });
    lecs.forEach(l => {
      // 파트 라벨에 보여줄 핵심 주제: 중요도 높은 개념 3개
      const topics = l.concepts.slice().sort((a, b) => b.importance - a.importance).slice(0, 3)
        .map(c => c.name.replace(/\(.*?\)/g, '').trim());
      const ln = { id: l.id, type: 'lecture', name: lecName(l), subject: s.id, lec: l.id, group: l.group || '', topics };
      if (single) { ln.fx = R * Math.cos(ang[l.id]); ln.fy = -R * Math.sin(ang[l.id]); ln.fz = 0; }
      add(ln);
      link(!gs.group && l.group ? groupId(s.id, l.group) : center.id, l.id, 'tree');
      l.concepts.filter(c => c.importance >= gs.minImp).forEach(c => {
        add({ id: c.id, type: 'concept', name: c.name, subject: s.id, lec: l.id, imp: c.importance, text: c.explanation, related: c.related || [] });
        link(l.id, c.id, 'tree');
      });
      if (gs.terms) l.terms.forEach(t => {
        add({ id: t.id, type: 'term', name: t.term, subject: s.id, lec: l.id, text: t.definition, related: [] });
        link(l.id, t.id, 'tree');
      });
    });
  });

  // 연관 링크
  const items = nodes.filter(n => n.type === 'concept' || n.type === 'term');
  const byName = {};
  items.forEach(n => { const k = coreName(n.name); (byName[k] = byName[k] || []).push(n); });
  const seen = new Set();
  const rel = (a, b, how) => {
    if (a.id === b.id) return;
    const key = a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id;
    if (seen.has(key)) return;
    seen.add(key);
    link(a.id, b.id, 'rel', { how, cross: a.subject !== b.subject, bridge: a.subject === b.subject && a.lec !== b.lec });
  };
  items.forEach(a => {
    a.related.forEach(r => (byName[coreName(r)] || []).forEach(b => rel(a, b, 'Claude가 연결')));
    (byName[coreName(a.name)] || []).forEach(b => rel(a, b, '같은 개념'));
  });
  items.forEach(a => {
    const k = coreName(a.name);
    if (k.length < 2) return;
    items.forEach(b => { if (b !== a && coreName(b.text).includes(k)) rel(a, b, '설명에 등장'); });
  });
  // 연관이 많은 개념(허브)일수록 크게 그리기 위한 값
  nodes.forEach(n => { n.relDeg = 0; });
  links.forEach(l => { if (l.kind === 'rel') { byId[l.source].relDeg++; byId[l.target].relDeg++; } });
  return { nodes, links, byId, adj, hl: new Set(), fitted: false, ringR };
}

function viewGraph() {
  return `<h2>연관 네트워크</h2>${graphBlock(true)}`;
}

/* 그래프 + 조작 버튼 묶음. 과목 화면에서는 과목 선택 없이 작게 넣는다 */
function graphBlock(withSubjectSelect) {
  const opt = (v, label, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${label}</option>`;
  return `<div class="meta">드래그: 회전 · 스크롤: 확대 · 점 클릭: 연결된 것만 강조 · 빈 곳 클릭: 해제</div>
    <div class="g-controls">
      ${withSubjectSelect ? `<select data-g="subject">${opt('all', '모든 과목', gs.subject)}${db.subjects.map(s => opt(s.id, esc(s.name), gs.subject)).join('')}</select>` : ''}
      <select data-g="minImp">${opt(3, '★★★ 핵심 개념만', gs.minImp)}${opt(2, '★★ 이상', gs.minImp)}${opt(1, '모든 개념', gs.minImp)}</select>
      <select data-g="colorBy">${opt('subject', '색: 과목별', gs.colorBy)}${opt('lecture', '색: 강의별', gs.colorBy)}${opt('status', '색: 복습 상태', gs.colorBy)}</select>
      <label><input type="checkbox" data-g="terms" ${gs.terms ? 'checked' : ''}> 용어 포함</label>
      <button class="btn small" data-act="g-reset">↺ 전체 보기</button>
    </div>
    <div class="graph-wrap ${withSubjectSelect ? '' : 'compact'}"><div id="graph"></div><div class="graph-labels" id="graphLabels"></div><div class="graph-msg" id="graphMsg">3D 그래프 불러오는 중…</div><div class="graph-panel" id="graphPanel"></div></div>
    <div class="legend" id="graphLegend"></div>`;
}

/* 과목(가운데 제목)과 강의·파트(무슨 내용인지)는 이름을 항상 화면에 띄운다.
   3D 좌표를 매 프레임 화면 좌표로 바꿔 HTML 라벨을 옮긴다 */
let labelRAF = null;
function stopLabels() { if (labelRAF) cancelAnimationFrame(labelRAF); labelRAF = null; }
function startLabels() {
  stopLabels();
  const layer = $('graphLabels');
  if (!layer || !G || !gData) return;
  const nodes = gData.nodes;
  const html = n =>
    n.center ? `<div class="glabel subj" data-lbl="${esc(n.id)}">${n.type === 'group' ? '📁 ' : ''}${esc(n.name)}</div>`
    : n.type === 'subject' ? `<div class="glabel subj" data-lbl="${esc(n.id)}">${esc(n.name)}</div>`
    : n.type === 'group' ? `<div class="glabel grp" data-lbl="${esc(n.id)}">📁 ${esc(n.name)}<span>파트 ${n.count}개</span></div>`
    : n.type === 'lecture' ? `<div class="glabel lec" data-lbl="${n.id}"><b>${esc(n.name)}</b>${n.topics.length ? `<span>${n.topics.map(esc).join(' · ')}</span>` : ''}</div>`
    : `<div class="glabel con ${n.imp === 3 ? 'key' : ''} ${n.type === 'term' ? 'term' : ''}" data-lbl="${n.id}">${esc(n.name.replace(/\(.*?\)/g, '').trim())}</div>`;
  layer.innerHTML = nodes.map(html).join('');
  // 크기를 한 번 재 둔다: 전체 / 축소(파트는 제목만)
  const els = nodes.map(n => {
    const el = [...layer.children].find(c => c.dataset.lbl === n.id);
    const full = [el.offsetWidth, el.offsetHeight];
    let mini = full;
    if (n.type === 'lecture') { el.classList.add('mini'); mini = [el.offsetWidth, el.offsetHeight]; el.classList.remove('mini'); }
    const rank = n.center || n.type === 'subject' ? 0 : n.type === 'group' ? 0.5 : n.type === 'lecture' ? 1 : n.type === 'concept' ? 5 - n.imp : 9;
    return { n, el, full, mini, rank };
  });
  const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const tick = () => {
    if (!G || !layer.isConnected) { labelRAF = null; return; }
    const cam = G.camera().position, act = activeId();
    const placed = [];
    const items = els.filter(o => o.n.x != null).map(o => {
      const d = Math.hypot(o.n.x - cam.x, o.n.y - cam.y, o.n.z - cam.z);
      const hl = act ? gData.hl.has(o.n.id) : true;
      // 우선순위: 과목 → 파트 → (강조된 것) → 중요 개념 → 가까운 것
      return { o, d, hl, p: G.graph2ScreenCoords(o.n.x, o.n.y, o.n.z), key: o.rank * 1e6 + (hl ? 0 : 5e6) + d };
    }).sort((a, b) => a.key - b.key);
    const W = layer.clientWidth, H = layer.clientHeight;
    const center = items.find(x => x.o.n.center);
    items.forEach(({ o, p, d, hl }) => {
      const t = o.n.type, subj = !!o.n.center || t === 'subject', small = t === 'concept' || t === 'term';
      const mid = subj || t === 'group'; // 라벨을 점 한가운데에 올리는 것
      // 멀리 있는 라벨은 작게 (원근감)
      const s = subj ? 1 : Math.max(0.65, Math.min(1.25, (small ? 380 : 520) / d));
      let rect = ([w, h]) => ({ x: p.x - (w * s) / 2, y: mid ? p.y - (h * s) / 2 : p.y + (small ? 4 : 8) * s, w: w * s, h: h * s });
      if (t === 'lecture' && center) {
        // 파트 라벨은 가운데 제목의 반대쪽(바깥)으로 밀어서 개념 덩어리를 가리지 않게
        const vx = p.x - center.p.x, vy = p.y - center.p.y, len = Math.hypot(vx, vy) || 1, ux = vx / len, uy = vy / len;
        rect = ([w, h]) => {
          const ww = w * s, hh = h * s, off = 46 * s;
          let cx = p.x + ux * (off + ww / 2 * Math.abs(ux)), cy = p.y + uy * (off + hh / 2 * Math.abs(uy));
          cx = Math.max(ww / 2 + 4, Math.min(W - ww / 2 - 4, cx)); cy = Math.max(hh / 2 + 4, Math.min(H - hh / 2 - 4, cy));
          return { x: cx - ww / 2, y: cy - hh / 2, w: ww, h: hh };
        };
      }
      let r = rect(o.full), mini = false;
      if (t === 'lecture' && placed.some(q => overlap(r, q))) { r = rect(o.mini); mini = true; }
      const hit = !subj && placed.some(q => overlap(r, q));
      let op = 1;
      if (act && !hl) op = small ? 0 : 0.15;     // 강조 중이면 나머지 라벨은 숨김
      else if (hit) op = small ? 0 : 0.3;        // 겹치는 개념 라벨은 숨김
      if (op > 0) placed.push(r);
      o.el.classList.toggle('mini', mini);
      o.el.style.transform = `translate(${r.x}px, ${r.y}px) scale(${s})`;
      o.el.style.opacity = op;
    });
    labelRAF = requestAnimationFrame(tick);
  };
  tick();
}

function renderLegend() {
  const el = $('graphLegend'); if (!el) return;
  const dot = c => `<span class="dot" style="background:${c}"></span>`;
  let h = gs.colorBy === 'subject'
    ? db.subjects.map(s => `<span>${dot(subjColor(s.id))}${esc(s.name)}</span>`).join('')
    : gs.colorBy === 'lecture'
    ? db.subjects.filter(s => gs.subject === 'all' || s.id === gs.subject)
        .flatMap(s => lecturesOf(s.id)).filter(l => !gs.group || (l.group || '') === gs.group).map(l => `<span>${dot(lecColor(l.id))}${esc(lecName(l))}</span>`).join('')
    : `<span>${dot(STATUS_COLOR.bad)}모름</span><span>${dot(STATUS_COLOR.mid)}애매</span><span>${dot(STATUS_COLOR.good)}앎</span><span>${dot(STATUS_COLOR[''])}미체크</span>`;
  const line = c => `<span class="lline" style="background:${c}"></span>`;
  h += `<span class="legend-break"></span><span>${line(treeColor())}파트 안 연관</span><span>${line(BRIDGE_COLOR)}파트를 넘는 연관</span><span>${line(CROSS_COLOR)}과목을 넘는 연관</span>`;
  if (gData) {
    const rels = gData.links.filter(l => l.kind === 'rel');
    h += `<span class="stat">연관 ${rels.length}개 · 파트 간 ${rels.filter(l => l.bridge).length}개 · 과목 간 ${rels.filter(l => l.cross).length}개</span>`;
  }
  el.innerHTML = h;
}

const BRIDGE_COLOR = '#f08c00';           // 파트를 넘는 연관
const activeId = () => gs.focus || gs.hover; // 클릭(고정) 또는 마우스 올림
function bgHex() { return (getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#ffffff'); }
function mix(a, b, t) { // 두 #rrggbb 색 섞기
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  if (!/^#[0-9a-f]{6}$/i.test(a) || !/^#[0-9a-f]{6}$/i.test(b)) return a;
  const x = p(a), y = p(b);
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function baseColor(n) {
  if (gs.colorBy === 'status' && (n.type === 'concept' || n.type === 'term')) return STATUS_COLOR[statusOf(n.id)] || STATUS_COLOR[''];
  if (n.type === 'subject' || n.center) return isDark() ? '#e9e7e2' : '#2b2a27';
  if (n.type === 'group') return isDark() ? '#b9b6ae' : '#5e5b55';
  if (gs.colorBy === 'lecture') return n.lec ? lecColor(n.lec) : treeColor();
  return subjColor(n.subject);
}
function nodeColor(n) {
  const a = activeId();
  if (a && !gData.hl.has(n.id)) return dimColor();
  return baseColor(n);
}
function isHlLink(l) { const a = activeId(), s = endId(l.source), t = endId(l.target); return s === a || t === a; }
function linkColor(l) {
  if (activeId() && !isHlLink(l)) return dimColor();
  if (l.kind === 'tree') return mix(baseColor(gData.byId[endId(l.target)]), bgHex(), 0.55); // 파트 색이 옅게 비치는 가지
  if (l.cross) return CROSS_COLOR;
  if (l.bridge) return BRIDGE_COLOR;
  return mix(baseColor(gData.byId[endId(l.source)]), isDark() ? '#ffffff' : '#000000', 0.15);
}
function linkWidth(l) {
  const on = activeId() && isHlLink(l);
  if (l.kind === 'tree') return on ? 0.8 : 0.35;
  return (l.cross ? 1.6 : l.bridge ? 1.2 : 0.6) * (on ? 1.8 : 1);
}
function refreshGraphStyle() {
  if (G) G.nodeColor(G.nodeColor()).linkColor(G.linkColor()).linkWidth(G.linkWidth())
    .linkDirectionalParticles(G.linkDirectionalParticles());
}

function applyGraphData() {
  gData = buildGraph();
  gs.focus = null; gs.hover = null;
  const msg = $('graphMsg'), panel = $('graphPanel');
  if (panel) panel.classList.remove('open');
  if (!gData.nodes.length) { msg.style.display = 'flex'; msg.textContent = '조건에 맞는 자료가 없어요.'; }
  else msg.style.display = 'none';
  G.graphData({ nodes: gData.nodes, links: gData.links });
  renderLegend();
  startLabels();
  // 과목 하나일 때는 가운데와 파트 위치가 고정이라 배치 계산을 기다리지 않고 바로 화면을 맞춤
  if (gData.ringR) { gData.fitted = true; fitView(0); }
}

function mountGraph() {
  const token = {}; mountToken = token;
  renderLegend();
  loadGraphLib().then(() => {
    if (mountToken !== token || !$('graph')) return;
    const el = $('graph');
    G = ForceGraph3D()(el)
      .width(el.clientWidth).height(el.clientHeight)
      .backgroundColor('rgba(0,0,0,0)')   // 배경은 CSS 그라데이션이 보이게 투명
      .showNavInfo(false)
      .nodeLabel(() => '')                 // 이름은 항상 떠 있는 라벨로 보여줌
      .nodeVal(n => n.type === 'subject' || n.center ? 34 : n.type === 'group' ? 20 : n.type === 'lecture' ? 12 : n.type === 'term' ? 1 : 1.2 + n.imp * 1.1 + Math.min(n.relDeg, 6) * 0.5)
      .nodeResolution(24)
      .nodeOpacity(1)
      .nodeColor(nodeColor)
      .linkColor(linkColor)
      .linkWidth(linkWidth)
      .linkOpacity(0.75)
      .linkCurvature(l => l.kind === 'rel' ? 0.22 : 0)
      .linkDirectionalParticles(l => (l.cross || l.bridge) && (!activeId() || isHlLink(l)) ? 2 : 0)
      .linkDirectionalParticleWidth(l => l.cross ? 2.2 : 1.8)
      .linkDirectionalParticleSpeed(0.004)
      .linkDirectionalParticleColor(l => l.cross ? CROSS_COLOR : BRIDGE_COLOR)
      .onNodeHover(n => {
        el.style.cursor = n ? 'pointer' : '';
        if (gs.focus) return;                   // 클릭으로 고정된 상태면 무시
        gs.hover = n ? n.id : null;
        gData.hl = n ? new Set([n.id, ...gData.adj[n.id]]) : new Set();
        refreshGraphStyle();
      })
      .warmupTicks(260)       // 화면에 그리기 전에 배치를 거의 끝내 둠 (라벨이 깜빡이지 않게)
      .cooldownTicks(60)      // 남은 미세 조정만 하고 멈춤
      .cooldownTime(15000)
      .onNodeClick(focusGraphNode)
      .onBackgroundClick(clearGraphFocus)
      .onEngineStop(() => { if (gData && !gData.fitted) { gData.fitted = true; fitView(600); } });
    // 파트(강의)끼리는 서로 밀어내 멀리, 개념은 자기 파트 주변에 모이게
    G.d3Force('charge').strength(n => n.type === 'lecture' ? -260 : n.type === 'subject' ? -150 : n.type === 'group' ? -200 : -50);
    G.d3Force('link').distance(l => l.kind === 'rel' ? 60 : (l.source.type === 'subject' ? 90 : l.source.type === 'group' ? 80 : 26))
      .strength(l => l.kind === 'rel' ? 0.12 : 0.8);
    G.cameraPosition({ x: 0, y: -230, z: 520 }); // 살짝 위에서 내려다보는 각도 (3D 느낌)
    applyGraphData();
  }).catch(() => {
    const m = $('graphMsg');
    if (m && mountToken === token) m.textContent = '3D 그래프 엔진을 불러오지 못했어요. 인터넷 연결을 확인해 주세요. (그래프만 온라인이 필요하고, 나머지 기능은 오프라인에서도 됩니다)';
  });
}

/* 화면 맞추기: 과목 하나면 '과목+파트' 고리에 맞춰 크게, 여러 과목이면 전체에 맞춤 */
function fitView(ms) {
  if (!G || !gData) return;
  if (gData.ringR) {
    // 고리 반지름을 알고 있으니 계산으로 바로 맞춤 (노드 위치 계산을 기다릴 필요 없음)
    const cam = G.camera(), half = Math.tan(cam.fov * Math.PI / 360) * Math.min(1, cam.aspect);
    const D = (gData.ringR + 70) / half, len = Math.hypot(230, 520);
    G.cameraPosition({ x: 0, y: -230 / len * D, z: 520 / len * D }, { x: 0, y: 0, z: 0 }, ms);
  } else G.zoomToFit(ms, 50);
}

function focusGraphNode(n) {
  if (!G || !n) return;
  gs.focus = n.id; gs.hover = null;
  gData.hl = new Set([n.id, ...gData.adj[n.id]]);
  refreshGraphStyle();
  // 지금 보는 방향을 유지한 채 그 점 쪽으로 다가감
  const c = G.camera().position, dx = c.x - n.x, dy = c.y - n.y, dz = c.z - n.z, len = Math.hypot(dx, dy, dz) || 1;
  const D = n.type === 'subject' || n.center ? 330 : n.type === 'group' ? 260 : n.type === 'lecture' ? 200 : 150;
  G.cameraPosition({ x: n.x + dx / len * D, y: n.y + dy / len * D, z: n.z + dz / len * D }, n, 900);
  showGraphPanel(n);
}
function clearGraphFocus() {
  gs.focus = null; gs.hover = null; gData.hl = new Set(); refreshGraphStyle();
  const p = $('graphPanel'); if (p) p.classList.remove('open');
}

function showGraphPanel(n) {
  const p = $('graphPanel'); if (!p) return;
  const s = subjOf(n.subject), l = n.lec ? lecOf(n.lec) : null;
  const relOf = id => gData.links.find(k => k.kind === 'rel' &&
    ((endId(k.source) === n.id && endId(k.target) === id) || (endId(k.target) === n.id && endId(k.source) === id)));
  const nbs = [...gData.adj[n.id]].map(id => gData.byId[id]).filter(Boolean)
    .sort((a, b) => (relOf(b.id) ? 1 : 0) - (relOf(a.id) ? 1 : 0));
  const LIMIT = 15;
  let h = `<div><span class="badge">${TYPE_LABEL[n.type]}</span> <b>${esc(n.name)}</b></div>`;
  if (n.type !== 'subject') h += `<div class="stat">${esc(s ? s.name : '')}${l && l.group && n.type !== 'group' ? ' · ' + esc(l.group) : ''}${l && n.type !== 'lecture' ? ' · ' + esc(lecName(l)) : ''}</div>`;
  if (n.text) h += `<div style="margin-top:8px">${esc(n.text)}</div>`;
  if (n.type === 'concept' || n.type === 'term') h += `<div style="margin-top:8px">${statusBtns(n.id)}</div>`;
  h += `<div class="stat" style="margin-top:12px">연결된 항목 ${nbs.length}개</div>`;
  nbs.slice(0, LIMIT).forEach(m => {
    const r = relOf(m.id);
    h += `<button class="nb" data-act="g-focus" data-id="${esc(m.id)}"><span class="dot" style="background:${baseColor(m)}"></span>${esc(m.name)}
      ${r ? `<span class="stat"> · ${r.cross ? '다른 과목 · ' : r.bridge ? '다른 파트 · ' : ''}${esc(r.how)}</span>` : `<span class="stat"> · ${TYPE_LABEL[m.type]}</span>`}</button>`;
  });
  if (nbs.length > LIMIT) h += `<div class="stat">외 ${nbs.length - LIMIT}개</div>`;
  const target = n.type === 'subject' ? `data-view="subject" data-id="${n.id}"` : n.type === 'group' ? `data-view="group" data-id="${esc(n.id)}"` : `data-view="lecture" data-id="${n.lec}" data-focus="${n.type === 'lecture' ? '' : n.id}"`;
  h += `<div class="row"><button class="btn small" data-act="nav" ${target}>자세히 보기 →</button></div>`;
  p.innerHTML = h;
  p.classList.add('open');
}

/* 상태 버튼만 바꾸고 화면은 그대로 둠 (그래프 카메라 위치 유지) */
function updateStatusInPlace(id) {
  const s = statusOf(id);
  document.querySelectorAll(`[data-act="status"][data-item="${id}"]`).forEach(b => { b.className = s === b.dataset.s ? 'on-' + s : ''; });
  const el = document.getElementById(id);
  if (el) el.classList.toggle('is-good', s === 'good');
}

/* 퀴즈 필터 */
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.qz;
  if (!k) return;
  qs[k] = e.target.value;
  if (k === 'subject') qs.lecture = 'all';
  render();
});

document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.g;
  if (!k || !G) return;
  if (k === 'terms') gs.terms = e.target.checked;
  else if (k === 'minImp') gs.minImp = +e.target.value;
  else gs[k] = e.target.value;
  if (k === 'colorBy') { refreshGraphStyle(); renderLegend(); }
  else { applyGraphData(); }
});
window.addEventListener('resize', () => { const el = $('graph'); if (G && el) G.width(el.clientWidth).height(el.clientHeight); });

/* =========================================================
   6. 이벤트
   ========================================================= */
let pending = null; // 검사 통과한 가져오기 데이터

/* --- 모바일 메뉴(☰): 메뉴 밖 아무 곳이나 누르면 닫힘 --- */
function setSidebar(open) {
  $('sidebar').classList.toggle('open', open);
  $('backdrop').classList.toggle('open', open);
}

/* --- 화면 이동 + 뒤로가기 (브라우저/휴대폰 뒤로가기 버튼과도 연동) --- */
let navDepth = 0;
function go(view, id, focus, push = true) {
  const same = ui.view === view && ui.id === (id || null) && !ui.query;
  ui.view = view; ui.id = id || null; ui.query = ''; $('search').value = '';
  if (view === 'quiz' && id) { // 강의·과목에서 '퀴즈 풀기'로 들어온 경우 그 범위로 거르기
    const l = lecOf(id), g = groupOf(id);
    if (l) { qs.subject = l.subject_id; qs.lecture = l.id; }
    else if (g) { qs.subject = g.sid; qs.lecture = g.id; }
    else if (subjOf(id)) { qs.subject = id; qs.lecture = 'all'; }
    qs.order = null;
  }
  setSidebar(false);
  if (push && !same) {
    navDepth++;
    history.pushState({ view, id: ui.id, focus: focus || '', depth: navDepth }, '', '#' + view + (ui.id ? '/' + ui.id : ''));
  }
  render(); window.scrollTo(0, 0);
  if (focus) { const t = $(focus); if (t) t.scrollIntoView({ block: 'center' }); }
  updateBack();
}
function goBack() {
  if (ui.query) { ui.query = ''; $('search').value = ''; render(); updateBack(); return; } // 검색 중이면 검색만 해제
  if (navDepth > 0) history.back();
}
function updateBack() { $('backBtn').disabled = navDepth === 0 && !ui.query; }
window.addEventListener('popstate', e => {
  const s = e.state || { view: 'overview', id: null, depth: 0 };
  navDepth = s.depth || 0;
  closeModals();
  go(s.view, s.id, s.focus, false);
});

document.addEventListener('click', e => {
  // 메뉴가 열려 있을 때 메뉴 바깥을 누르면 닫기 (☰ 버튼은 아래 toggle에서 처리)
  if ($('sidebar').classList.contains('open') && !e.target.closest('#sidebar') && !e.target.closest('#menuBtn')) {
    setSidebar(false);
    if (e.target.closest('#backdrop')) return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (el.tagName === 'A') e.preventDefault();

  switch (act) {
    case 'nav': go(el.dataset.view, el.dataset.id, el.dataset.focus); break;
    case 'back': goBack(); break;
    case 'status': {
      const id = el.dataset.item, v = el.dataset.s;
      if (statusOf(id) === v) delete db.progress[id]; else db.progress[id] = { s: v, t: Date.now() };
      save();
      if (G) { updateStatusInPlace(id); refreshGraphStyle(); } // 그래프가 있는 화면은 다시 그리지 않음
      else render();
      break;
    }
    case 'quiz-shuffle': {
      const ids = db.lectures.flatMap(l => l.quizzes.map(q => q.id));
      for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
      qs.order = ids; render(); window.scrollTo(0, 0);
      break;
    }
    case 'quiz-unshuffle': qs.order = null; render(); break;
    case 'quiz-collapse': document.querySelectorAll('details[data-q]').forEach(d => d.open = false); break;
    case 'g-focus': if (gData) focusGraphNode(gData.byId[el.dataset.id]); break;
    case 'g-reset': if (G) { clearGraphFocus(); G.cameraPosition({ x: 0, y: -230, z: 520 }); fitView(600); } break;
    case 'hide-know': ui.hideKnow = el.checked; render(); break;
    case 'toggle-sidebar': setSidebar(!$('sidebar').classList.contains('open')); break;
    case 'delete-lecture': {
      const l = lecOf(el.dataset.id);
      if (!l || !confirm(`"${l.title}" 자료를 삭제할까요? 복습 체크 기록도 함께 지워집니다.`)) return;
      itemIds(l).forEach(id => delete db.progress[id]);
      db.lectures = db.lectures.filter(x => x !== l);
      db.subjects = db.subjects.filter(s => db.lectures.some(x => x.subject_id === s.id));
      save(); go('overview'); toast('삭제했어요');
      break;
    }
    case 'open-import': openModal('importModal'); break;
    case 'open-prompt': closeModals(); $('promptText').value = PROMPT; openModal('promptModal'); break;
    case 'close-modal': closeModals(); break;
    case 'copy-prompt':
      navigator.clipboard.writeText(PROMPT).then(() => toast('복사했어요'), () => { $('promptText').select(); toast('Ctrl/Cmd+C로 복사하세요'); });
      break;
    case 'check-import': checkImport(); break;
    case 'do-import': doImport(); break;
    case 'export': exportBackup(); break;
  }
});

$('search').addEventListener('input', e => { ui.query = e.target.value.trim(); render(); updateBack(); });
$('importText').addEventListener('input', () => { pending = null; $('doImportBtn').disabled = true; });
$('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { $('importText').value = r.result; checkImport(); };
  r.readAsText(f);
});
document.querySelectorAll('.modal-bg').forEach(bg => bg.addEventListener('click', e => { if (e.target === bg) closeModals(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModals(); setSidebar(false); } });

function openModal(id) {
  if (id === 'importModal') {
    $('importText').value = ''; $('importFile').value = ''; $('importMsg').className = 'msg';
    $('subjectRow').style.display = 'none'; $('doImportBtn').disabled = true; pending = null;
    $('subjectList').innerHTML = db.subjects.map(s => `<option value="${esc(s.name)}">`).join('');
  }
  $(id).classList.add('open');
}
function closeModals() { document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('open')); }

function showMsg(type, title, list) {
  const m = $('importMsg');
  m.className = 'msg ' + type;
  m.innerHTML = esc(title) + (list && list.length ? `<ul>${list.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '');
}

function checkImport() {
  pending = null; $('doImportBtn').disabled = true; $('subjectRow').style.display = 'none';
  let data;
  try { data = parseInput($('importText').value); }
  catch (e) { return showMsg('err', 'JSON 형식이 올바르지 않아요: ' + e.message); }

  // 전체 백업 파일인 경우
  if (data && Array.isArray(data.lectures) && Array.isArray(data.subjects)) {
    pending = { backup: data };
    $('doImportBtn').disabled = false;
    return showMsg('ok', `백업 파일이에요 (과목 ${data.subjects.length}개, 강의 ${data.lectures.length}개). [추가하기]를 누르면 현재 데이터를 이 백업으로 바꿉니다.`);
  }

  const list = Array.isArray(data) ? data : [data];
  const errors = [], warnings = [];
  list.forEach((o, i) => { const r = validate(o, list.length > 1 ? i : null); errors.push(...r.errors); warnings.push(...r.warnings); });
  if (errors.length) return showMsg('err', '스키마와 맞지 않는 부분이 있어요. Claude에게 고쳐 달라고 하거나 직접 수정하세요.', errors);

  pending = { list };
  $('subjectRow').style.display = 'flex';
  $('importSubject').value = str(list[0].subject);
  $('importSubject').placeholder = list.length > 1 ? '비우면 각 자료의 subject 사용' : '기존 과목에서 고르거나 새로 입력';
  $('doImportBtn').disabled = false;
  const counts = list.map(o => `${str(o.lecture.title)} — 개념 ${(o.concepts || []).length}, 용어 ${(o.terms || []).length}, 퀴즈 ${(o.quizzes || []).length}`);
  showMsg('ok', '검사 통과! 과목명을 확인하고 [추가하기]를 누르세요.', [...counts, ...warnings.map(w => '⚠ ' + w)]);
}

function doImport() {
  if (!pending) return;
  if (pending.backup) {
    if (!confirm('현재 데이터를 백업 파일 내용으로 바꿀까요? 지금 데이터는 사라집니다.')) return;
    db = Object.assign(emptyDb(), pending.backup);
    db.progress = db.progress || {};
    save(); closeModals(); go('overview'); toast('백업을 불러왔어요');
    return;
  }
  const override = str($('importSubject').value);
  let last;
  pending.list.forEach(o => {
    const name = override || str(o.subject);
    last = addLecture(db, o, name || '미분류', false);
  });
  save(); closeModals();
  go('lecture', last.id);
  toast(`${pending.list.length}개 자료를 추가했어요`);
  pending = null;
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `복습노트_백업_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

db = load();
history.replaceState({ view: 'overview', id: null, focus: '', depth: 0 }, '', location.pathname + location.search);
render();
updateBack();
</script>
</body>
</html>
